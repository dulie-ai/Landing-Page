  <text x="74" y="272" fill="#fff" font-family="Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-5">Make plans.</text>
  <text x="74" y="358" fill="#a28dff" font-family="Georgia, serif" font-size="88" font-style="italic" letter-spacing="-4">Keep them.</text>
  <text x="78" y="432" fill="#fff" fill-opacity=".63" font-family="Arial, sans-serif" font-size="24">Events, reminders, to-dos, and notes—</text>
  <text x="78" y="467" fill="#fff" fill-opacity=".63" font-family="Arial, sans-serif" font-size="24">all from one Telegram conversation.</text>
