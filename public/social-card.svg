    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7455ff" stop-opacity=".52"/>
      <stop offset="1" stop-color="#7455ff" stop-opacity="0"/>
